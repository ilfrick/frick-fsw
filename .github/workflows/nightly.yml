# frick-fsw nightly RTEMS qualification build (norm N6/SSS-REQ-001)
#
# The per-commit job `rtems-cross-build` in ci.yml is a SKIP proxy when the
# RTEMS toolchain is absent; this workflow installs the full RTEMS 6.2
# toolchain (open-source RTEMS project, BSP
# riscv/mpfs64imafdc) with rtems-source-builder and performs the real cross
# build and documentation of the result in docs/vv/verification-results.md.
#
# Copyright (C) 2026 Ilfrick
# https://github.com/ilfrick/frick-fsw | https://www.housefz.com/git/ilfrick/frick-fsw
# SPDX-License-Identifier: MPL-2.0
name: nightly

on:
  schedule:
    - cron: "0 2 * * 1"   # weekly, Monday 02:00 UTC
  workflow_dispatch:

jobs:
  rtems-cross-build:
    name: RTEMS 6.2 cross build (riscv/mpfs64imafdc)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RTEMS_HOME: /opt/rtems
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned third-party dependencies before default configure
        run: bash tools/scripts/fetch_third_party.sh all
      - name: Generate default N7/ESA ASN.1 common sources
        run: make pus-asn1

      - name: Bootstrap RTEMS 6.2 toolchain (RSB)
        run: |
          sudo mkdir -p /opt/rtems && sudo chown -R runner /opt/rtems
          bash tools/scripts/setup_rtems.sh

      - name: Cross build
        run: |
          cmake -S . -B build/rtems \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/rtems-riscv-mpfs.cmake \
            -DFF_PLATFORM=rtems
          cmake --build build/rtems -j$(nproc)
          echo "RTEMS cross build: PASS" | tee /tmp/rtems-result.txt

      - name: Build Renode functional image (open RTEMS + test app)
        run: |
          cmake -S . -B build/renode \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/rtems-riscv-mpfs.cmake \
            -DFF_PLATFORM=rtems -DFF_ENABLE_RENODE_TEST=ON
          cmake --build build/renode -j$(nproc)
          cp build/renode/frick_fsw build/renode/frick_fsw_renode.elf

      - name: Renode functional validation (norm N18)
        run: |
          make renode-env
          make renode
          grep -q "RENODE_TEST: PASS" build/renode/console.log
          echo "Renode functional validation: PASS"

      # lwIP network-stack adapter on the RTEMS target (SRS-REQ-040, NC-151-02):
      # fetch the pinned lwIP, cross-build the image with FF_USE_LWIP=ON and
      # FF_ENABLE_RENODE_TEST=ON, check that the lwIP stack symbols are linked
      # in, then run the peripheral-bound lwIP-on-GEM check in Renode.
      - name: Cross build with the lwIP adapter (FF_USE_LWIP=ON)
        run: |
          cmake -S . -B build/renode-lwip \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/rtems-riscv-mpfs.cmake \
            -DFF_PLATFORM=rtems -DFF_ENABLE_RENODE_TEST=ON -DFF_USE_LWIP=ON
          cmake --build build/renode-lwip -j$(nproc)
          # Link check: the lwIP stack and the netif glue must be resolved into
          # the image (the adapter is referenced by the Renode check app).
          NM="${RTEMS_HOME}/6/bin/riscv-rtems6-nm"
          "${NM}" build/renode-lwip/frick_fsw > /tmp/frick_fsw_lwip.syms
          grep -qw tcpip_init /tmp/frick_fsw_lwip.syms
          grep -qw FF_LwipNetifAttach /tmp/frick_fsw_lwip.syms
          echo "RTEMS cross build with FF_USE_LWIP=ON: PASS"

      - name: Renode lwIP-on-GEM validation (NC-S6-01 residual)
        run: |
          cp build/renode-lwip/frick_fsw build/renode/frick_fsw_renode.elf
          make renode
          grep -q "RENODE_TEST: PASS" build/renode/console.log
          grep -q "hal_net_lwip=PASS" build/renode/console.log
          echo "Renode lwIP-on-GEM validation: PASS (hal_net_lwip=PASS)"

      # QEMU leg of the emulated-target evidence (SRS-REQ-043, tool T20); the
      # `ci-emulated-run` claim itself is declared in ci.yml (trace.py scans
      # ci.yml/.gitea ci.yml only, so no `# evidence:` marker is used here).
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc

      - name: Build generic-BSP image (rv64imafdc) for QEMU
        run: make qemu-image

      - name: QEMU emulated-target validation (milestone M10)
        run: |
          make qemu
          grep -aq "applications registered" build/rtems-generic/qemu-console.log
          echo "QEMU emulated-target validation: PASS"

      - name: Upload cross-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtems-mpfs64imafdc-build
          path: build/rtems/frick_fsw
