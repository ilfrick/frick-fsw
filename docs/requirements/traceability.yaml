# frick-fsw traceability manifest
#
# Single source of truth for bidirectional traceability (norm N4):
#   SSS -> SRS -> implementation -> tests -> Lean theorems, and bottom-up.
# This file is consumed by tools/scripts/trace.py; every change must re-verify
# convergence (CI job `trace` and the pre-commit flow).
#
# Field meanings:
#   id           requirement id; must appear verbatim in docs/requirements/SSS.md
#                or SRS.md (or in docs/quality/class-a-gaps.md for GAP-*).
#   level        srs | sss | gap
#   parent_sss   id of the parent SSS requirement (srs entries only). Every sss
#                entry must have at least one child and every srs entry exactly
#                one parent (bidirectional trace, norm N4).
#   derived      true when the requirement is derived from a higher level
#                artifact / tailoring; `justification` is then required.
#   gap          true for class-A gap items (norm N5); `justification` required.
#   implementation   files / modules delivering the requirement (paths are
#                checked to exist by trace.py).
#   tests        test resources; file paths or `ci:<name>` pseudo-resources
#                that must be claimed by a CI workflow (norm N6).
#   lean         Lean theorem names discharging the requirement (norm N1/N3);
#                matched against verification/lean/**/*.lean.
#   lean_note    justification when a requirement is verified by analysis,
#                inspection or test evidence instead of a Lean theorem.
# ----------------------------------------------------------------------------
schema_version: "1.0"

