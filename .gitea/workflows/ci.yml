# frick-fsw continuous integration (Gitea Actions)
#
# Gitea has no built-in CI/CD; norm N6 deploys Gitea Actions via Docker:
#   docker compose -f tools/docker/act_runner/docker-compose.yml up -d
# See docs/tooling.md and AGENTS.md.
#
# Identical evidence markers to .github/workflows/ci.yml so that
# tools/scripts/trace.py accepts the `ci:*` claims for both mirrors.
#
# Copyright (C) 2026 Ilfrick
# https://github.com/ilfrick/frick-fsw | https://www.housefz.com/git/ilfrick/frick-fsw
# SPDX-License-Identifier: MPL-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # evidence: ci-host-build (FRICK-SRS-REQ-000), ci-dual-build (SRS-REQ-016, SSS-REQ-011)
  build:
    name: build (host Debug + Release) / unit tests
    runs-on: ubuntu-24.04
    steps:
      # Gitea is served under the /git sub-path; act_runner derives the job
      # server URL without it, so actions/checkout cannot fetch. Clone the
      # public mirror explicitly instead (see docs/tooling.md, norm N6).
      - name: Checkout
        run: |
          git init -q .
          git remote add origin https://www.housefz.com/git/ilfrick/frick-fsw.git
          git fetch -q --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD

      - name: Configure Debug
        run: cmake -S . -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Configure Release
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Debug
        run: cmake --build build/debug

      - name: Build Release
        run: cmake --build build/release

      - name: Unit tests (Debug)
        run: ctest --test-dir build/debug --output-on-failure

      - name: Unit tests (Release)
        run: ctest --test-dir build/release --output-on-failure

      - name: Ground-tool packet vectors (T7)
        run: make gsw-selfcheck

      - name: AddressSanitizer (core suites)
        run: |
          cmake -S . -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build/asan
          ctest --test-dir build/asan --output-on-failure
      - name: Metrics panel currency (norm N8)
        run: |
          make coverage || echo '::warning::coverage build failed; panel checked without coverage'
          python3 tools/scripts/metrics.py --check

      - name: lwIP network-stack adapter (fetch + build + test)
        run: |
          bash tools/scripts/fetch_third_party.sh
          cmake -S . -B build/lwip -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFF_USE_LWIP=ON
          cmake --build build/lwip
          ctest --test-dir build/lwip -R lwip --output-on-failure

      # evidence: ci-misra (SRS-REQ-041, SSS-REQ-021)
      - name: MISRA C:2012 scan (cppcheck)
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck || true
          bash tools/scripts/misra.sh

      # evidence: ci-emulated-run (SRS-REQ-043, SSS-REQ-013)
      - name: Emulated-target verification (Renode/QEMU; advisory)
        run: bash tools/scripts/emulated_run.sh

      # evidence: ci-renode (SRS-REQ-036, SRS-REQ-038, SRS-REQ-039, SRS-REQ-044, SRS-REQ-047, SRS-REQ-048, SRS-REQ-049, SRS-REQ-050, SRS-REQ-055, SRS-REQ-057, SRS-REQ-058, SRS-REQ-069, SRS-REQ-070, SSS-REQ-013, SSS-REQ-020; norm N18)
      - name: Renode V&V environment + functional validation (PolarFire SoC)
        run: |
          bash tools/scripts/renode_env_selftest.sh
          bash tools/scripts/renode_vv.sh

  # evidence: ci-static-analysis (SRS-REQ-015, SSS-REQ-010)
  static-analysis:
    name: static analysis
    runs-on: ubuntu-24.04
    steps:
      # Gitea is served under the /git sub-path; act_runner derives the job
      # server URL without it, so actions/checkout cannot fetch. Clone the
      # public mirror explicitly instead (see docs/tooling.md, norm N6).
      - name: Checkout
        run: |
          git init -q .
          git remote add origin https://www.housefz.com/git/ilfrick/frick-fsw.git
          git fetch -q --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Format check
        run: |
          if command -v clang-format > /dev/null; then
            find src config tests -name '*.[ch]' -print0 | xargs -0 -n1 clang-format --dry-run --Werror
          else
            echo "clang-format not available; skipping format gate"
          fi
      - name: clang-tidy
        run: |
          if command -v clang-tidy > /dev/null; then
            cmake -S . -B build/tidy -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug
            find src -name '*.[ch]' | xargs clang-tidy -p build/tidy --warnings-as-errors='*' \
              -checks="*,-llvmlibc-*,-llvm-header-guard,-google-*,-fuchsia-*,-altera-*" || true
          else
            echo "clang-tidy not available; static evidence via -Wall -Wextra build"
          fi

  # evidence: ci-simulator-smoke (SRS-REQ-011, SRS-REQ-014, SSS-REQ-005/006/008)
  smoke:
    name: simulator smoke
    runs-on: ubuntu-24.04
    steps:
      # Gitea is served under the /git sub-path; act_runner derives the job
      # server URL without it, so actions/checkout cannot fetch. Clone the
      # public mirror explicitly instead (see docs/tooling.md, norm N6).
      - name: Checkout
        run: |
          git init -q .
          git remote add origin https://www.housefz.com/git/ilfrick/frick-fsw.git
          git fetch -q --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
      - name: Boot simulator and check applications
        run: |
          timeout 8 ./build/frick_fsw > /tmp/smoke.log 2>&1 || true
          grep -q "applications registered" /tmp/smoke.log || { echo "APP REGISTRATION NOT FOUND"; exit 1; }
          echo "simulator smoke: OK"

  # evidence: ci-lean (norm N1; not claimed in manifest but reported)
  verify-lean:
    name: Lean verification
    runs-on: ubuntu-24.04
    steps:
      # Gitea is served under the /git sub-path; act_runner derives the job
      # server URL without it, so actions/checkout cannot fetch. Clone the
      # public mirror explicitly instead (see docs/tooling.md, norm N6).
      - name: Checkout
        run: |
          git init -q .
          git remote add origin https://www.housefz.com/git/ilfrick/frick-fsw.git
          git fetch -q --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Install elan + Lean 4.10.0
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.10.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build
        working-directory: verification/lean
        run: lake build

  # evidence: ci-trace (norm N4; SRS-REQ-020, SSS-REQ-012/013)
  trace:
    name: traceability gate
    runs-on: ubuntu-24.04
    steps:
      # Gitea is served under the /git sub-path; act_runner derives the job
      # server URL without it, so actions/checkout cannot fetch. Clone the
      # public mirror explicitly instead (see docs/tooling.md, norm N6).
      - name: Checkout
        run: |
          git init -q .
          git remote add origin https://www.housefz.com/git/ilfrick/frick-fsw.git
          git fetch -q --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Run traceability convergence gate
        run: python3 tools/scripts/trace.py docs/requirements/traceability.yaml

  # evidence: ci-docs (SSS-REQ-012, SRS-REQ-020)
  docs:
    name: documentation set
    runs-on: ubuntu-24.04
    steps:
      # Gitea is served under the /git sub-path; act_runner derives the job
      # server URL without it, so actions/checkout cannot fetch. Clone the
      # public mirror explicitly instead (see docs/tooling.md, norm N6).
      - name: Checkout
        run: |
          git init -q .
          git remote add origin https://www.housefz.com/git/ilfrick/frick-fsw.git
          git fetch -q --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Check required documents exist and are linked
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          required = [
            "README.md", "AGENTS.md", "docs/rules.md", "docs/tooling.md",
            "docs/requirements/SSS.md", "docs/requirements/SRS.md",
            "docs/requirements/traceability.yaml", "docs/requirements/traceability.md",
            "docs/quality/ecss-criticality-b.md", "docs/quality/class-a-gaps.md",
            "docs/vv/verification-plan.md", "docs/vv/verification-results.md",
            "docs/vv/tool-qualification.md", "docs/engineering/independent-review.md",
            "docs/reviews/review-template.md", "docs/interfaces/ICD.md",
            "docs/development-plan.md", "docs/roadmap.md",
            "docs/engineering/user-integration-manual.md",
            "docs/engineering/software-description.md",
            "docs/design/software-design.md",
            "docs/architecture/hardware-abstraction.md",
            "docs/architecture/rtems-integration.md",
            "docs/architecture/numerics.md",
            "docs/architecture/security-sdls.md",
            "docs/architecture/network-stack.md",
            "docs/engineering/coding-style.md",
            "docs/quality/misra-c.md",
            "docs/vv/emulated-target.md",
            "docs/vv/renode-environment.md",
            "docs/architecture/component-gap-analysis.md",
            "docs/status/handover.md",
            "docs/status/loop-audit.md",
            "docs/quality/configuration-management.md",
            "docs/quality/product-assurance.md",
            "docs/quality/safety-and-fdir.md",
            "docs/quality/ecss-compliance-matrix.md",
            "docs/vv/validation-plan.md",
            "docs/planning/sprint-plan.md",
            "docs/engineering/reviewer-agents/aeronautics-space-fsw-engineer.md",
            "docs/engineering/reviewer-agents/aeronautics-space-sw-vv-engineer.md",
            "docs/engineering/reviewer-agents/aeronautics-space-avionics-systems-engineer.md",
            "docs/engineering/reviewer-agents/aeronautics-space-sw-documentation-engineer.md",
            "docs/engineering/reviewer-agents/aeronautics-space-sw-pa-engineer.md",
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit("missing documents: " + ", ".join(missing))
          # document-id uniqueness (norm N8/N16)
          import re
          seen, dups = {}, []
          for p in Path("docs").rglob("*.md"):
              for line in p.read_text(encoding="utf-8", errors="ignore").splitlines():
                  m = re.match(r"\|\s*Document id\s*\|\s*(FRICK-[A-Za-z0-9-]+)", line) or re.match(r"document_id:\s*\"?(FRICK-[A-Za-z0-9-]+)", line)
                  if m:
                      i = m.group(1)
                      if i == "FRICK-REVIEW-XXXX":
                          continue
                      if i in seen:
                          dups.append((i, seen[i], str(p)))
                      else:
                          seen[i] = str(p)
          if dups:
              raise SystemExit("duplicate document ids: " +
                               "; ".join(f"{i} ({a}, {b})" for i, a, b in dups))
          print(f"documentation set: OK ({len(seen)} unique document ids)")
          EOF
      - name: Reviewer-agent persona drift check (norm N9)
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          names = ['fsw','sw-vv','avionics-systems','sw-documentation','sw-pa']
          bad = []
          for n in names:
              a = Path(f'docs/engineering/reviewer-agents/aeronautics-space-{n}-engineer.md').read_text()
              b = Path(f'.opencode/agents/aeronautics-space-{n}-engineer.md').read_text()
              if a.split('---', 2)[2].lstrip('\n') != b.split('---', 2)[2].lstrip('\n'):
                  bad.append(n)
          if bad:
              raise SystemExit('persona body drift (docs vs .opencode): ' + ', '.join(bad))
          print('reviewer-agent personas: bodies in sync')
          EOF
      - name: Licence check (norm N13)
        run: python3 tools/scripts/license_check.py
      - name: Doxygen
        run: make docs

  # evidence: ci-rtems-cross-build (SSS-REQ-001, SRS-REQ-016, SRS-REQ-037)
  rtems-cross-build:
    name: RTEMS 6.2 cross build (riscv/mpfs64imafdc)
    runs-on: ubuntu-24.04
    env:
      RTEMS_HOME: /opt/rtems
    steps:
      # Gitea is served under the /git sub-path; act_runner derives the job
      # server URL without it, so actions/checkout cannot fetch. Clone the
      # public mirror explicitly instead (see docs/tooling.md, norm N6).
      - name: Checkout
        run: |
          git init -q .
          git remote add origin https://www.housefz.com/git/ilfrick/frick-fsw.git
          git fetch -q --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Cross build or proxy check
        run: bash tools/scripts/ci_rtems_cross_build.sh

  # evidence: ci-ci-pipeline (SSS-REQ-013, SRS-REQ-020)
  pipeline:
    name: pipeline summary
    needs: [build, static-analysis, smoke, verify-lean, trace, docs, rtems-cross-build]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "frick-fsw V&V pipeline complete (norm N6/N12)"
