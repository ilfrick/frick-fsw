<?xml version="1.0" encoding="UTF-8"?>
<!--
  frick-fsw project mark - codename "Earendil"
  The mariner who sails the night sky as the morning star, bearing a
  Silmaril on his brow. A white ship with a sparkling star on a midnight
  blue field.

  SPDX-License-Identifier: MPL-2.0
  Copyright (C) 2026 Ilfrick
  https://github.com/ilfrick/frick-fsw | https://www.housefz.com/git/ilfrick/frick-fsw
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">frick-fsw - codename Earendil</title>
  <desc id="desc">White stylized ship and star on a midnight blue field.</desc>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#12224f"/>
      <stop offset="0.55" stop-color="#0a1434"/>
      <stop offset="1" stop-color="#050a1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- midnight-blue field -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#night)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- faint background stars -->
  <g fill="#ffffff">
    <circle cx="96" cy="104" r="3.2" opacity="0.45"/>
    <circle cx="410" cy="112" r="2.4" opacity="0.38"/>
    <circle cx="120" cy="316" r="2.2" opacity="0.30"/>
    <circle cx="404" cy="300" r="2.8" opacity="0.34"/>
    <circle cx="352" cy="72" r="1.8" opacity="0.30"/>
  </g>

  <!-- halo around the morning star -->
  <circle cx="256" cy="140" r="184" fill="url(#glow)"/>

  <!-- morning star / Silmaril (eight-pointed sparkle) -->
  <g transform="translate(256 140)" fill="#ffffff">
    <path d="M0,-96 C5,-28 28,-5 96,0 C28,5 5,28 0,96
             C-5,28 -28,5 -96,0 C-28,-5 -5,-28 0,-96 Z"/>
    <path transform="rotate(45) scale(0.54)"
          d="M0,-96 C5,-28 28,-5 96,0 C28,5 5,28 0,96
             C-5,28 -28,5 -96,0 C-28,-5 -5,-28 0,-96 Z"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
  </g>

  <!-- mast -->
  <line x1="256" y1="224" x2="256" y2="372" stroke="#ffffff"
        stroke-width="9" stroke-linecap="round"/>

  <!-- billowing sail -->
  <path d="M256,246 C180,286 158,318 256,360 Z" fill="#ffffff" fill-opacity="0.96"/>

  <!-- hull -->
  <path d="M150,372 L362,372 L322,410 Q256,427 190,410 Z" fill="#ffffff"/>

  <!-- waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="7">
    <path d="M112,436 Q184,416 256,436 T400,436" stroke-opacity="0.55"/>
    <path d="M112,462 Q184,442 256,462 T400,462" stroke-opacity="0.38"/>
    <path d="M112,488 Q184,468 256,488 T400,488" stroke-opacity="0.24"/>
  </g>
</svg>
