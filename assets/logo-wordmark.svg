<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320"
     viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">frick-fsw - codename Earendil</title>
  <desc id="desc">Project lockup: stylized ship and star mark above the name frick-fsw.</desc>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#12224f"/>
      <stop offset="0.55" stop-color="#0a1434"/>
      <stop offset="1" stop-color="#050a1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="48" fill="url(#night)"/>
  <rect x="6" y="6" width="1188" height="308" rx="42" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- mark -->
  <g transform="translate(28 6) scale(0.56)">
    <circle cx="256" cy="140" r="188" fill="url(#glow)"/>
    <g transform="translate(256 140)" fill="#ffffff">
      <path d="M0,-96 C5,-28 28,-5 96,0 C28,5 5,28 0,96
               C-5,28 -28,5 -96,0 C-28,-5 -5,-28 0,-96 Z"/>
      <path transform="rotate(45) scale(0.54)"
            d="M0,-96 C5,-28 28,-5 96,0 C28,5 5,28 0,96
               C-5,28 -28,5 -96,0 C-28,-5 -5,-28 0,-96 Z"/>
      <circle cx="0" cy="0" r="12"/>
    </g>
    <line x1="256" y1="224" x2="256" y2="372" stroke="#ffffff"
          stroke-width="9" stroke-linecap="round"/>
    <path d="M256,246 C180,286 158,318 256,360 Z" fill="#ffffff" fill-opacity="0.96"/>
    <path d="M150,372 L362,372 L322,410 Q256,427 190,410 Z" fill="#ffffff"/>
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="7">
      <path d="M112,436 Q184,416 256,436 T400,436" stroke-opacity="0.55"/>
      <path d="M112,462 Q184,442 256,462 T400,462" stroke-opacity="0.38"/>
      <path d="M112,488 Q184,468 256,488 T400,488" stroke-opacity="0.24"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif" fill="#ffffff">
    <text x="366" y="150" font-size="94" font-weight="700"
          letter-spacing="0.5">frick-fsw</text>
    <text x="368" y="204" font-size="40" font-weight="400" fill-opacity="0.82">codename &#8220;E&#228;rendil&#8221;</text>
    <text x="368" y="258" font-size="24" font-weight="400" fill-opacity="0.62"
          letter-spacing="0.3">PUS-C &#183; CCSDS Space Packets &#183; RTEMS 6.2 &#183; RISC-V</text>
  </g>
</svg>
